<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grab Character</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0b141a; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(18, 28, 36, 0.9); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-weight: bold; font-size: 18px; color: #00d2ff; }
        .balance-box { background: rgba(0, 210, 255, 0.1); border: 1px solid #00d2ff; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        
        .content { flex: 1; padding: 15px; overflow-y: auto; display: none; }
        .content.active { display: block; }
        
        .profile-card { background: rgba(25, 35, 45, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 12px; display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        .avatar { width: 50px; height: 50px; background: #00d2ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: #000; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .clicker-box { background: rgba(25, 35, 45, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 15px; }
        .click-btn { width: 150px; height: 150px; background: radial-gradient(circle, #00d2ff, #005f73); border-radius: 50%; border: none; font-size: 32px; font-weight: bold; color: #fff; cursor: pointer; box-shadow: 0 0 20px rgba(0, 210, 255, 0.5); margin: 15px auto; display: flex; align-items: center; justify-content: center; transition: 0.1s; outline: none; }
        .click-btn:active { transform: scale(0.95); }
        
        .reward-box { background: rgba(25, 35, 45, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; text-align: center; margin-bottom: 15px; }
        .claim-btn { background: #00d2ff; color: #000; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; outline: none; }
        .claim-btn:active { opacity: 0.8; }

        .admin-panel-btn { background: #ff4757; color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: bold; width: 100%; margin-bottom: 15px; cursor: pointer; display: none; }

        nav { display: flex; justify-content: space-around; background: #121c24; padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.1); }
        .nav-item { background: none; border: none; color: #888; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; outline: none; }
        .nav-item.active { color: #00d2ff; }
        .nav-item span { font-size: 18px; }

        .section-title { font-size: 20px; margin-bottom: 15px; color: #00d2ff; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Grab Character</div>
        <div class="balance-box" id="headerBalance">💎 0 GC</div>
    </header>

    <div id="tab-asosiy" class="content active">
        <button class="admin-panel-btn" id="adminBtn" onclick="openAdminPanel()">⚙️ Ilova Admin Paneli</button>

        <div class="profile-card">
            <div class="avatar" id="userAvatarContainer">
                <span id="userInitial">U</span>
            </div>
            <div>
                <h3 id="userName">Foydalanuvchi</h3>
                <p style="font-size: 12px; color: #888;" id="userId">ID: Aniqlanmoqda...</p>
            </div>
        </div>

        <div class="clicker-box">
            <button class="click-btn" onclick="tapCoin()">GC</button>
            <p id="limitText" style="color: #888; font-size: 14px;">Limit: 100 / 100</p>
        </div>

        <div class="reward-box">
            <h4>🎁 Kunlik Sovg'a</h4>
            <p style="font-size: 13px; color: #888; margin-top: 5px;">Har 24 soatda bepul tanga oling!</p>
            <button class="claim-btn" id="claimBtn" onclick="claimDaily()">Sovg'ani Olish (+50 GC)</button>
        </div>
    </div>

    <div id="tab-harem" class="content">
        <div class="section-title">✨ Sizning Haremingiz</div>
        <p style="color: #888;">Hozircha personajlar yo'q (0).</p>
    </div>

    <div id="tab-do'kon" class="content">
        <div class="section-title">🛒 Do'kon</div>
        <p style="color: #888;">Do'kon bo'sh.</p>
    </div>

    <div id="tab-bozor" class="content">
        <div class="section-title">📊 Bozor</div>
        <p style="color: #888;">Savdo-sotiq mavjud emas.</p>
    </div>

    <div id="tab-oyinlar" class="content">
        <div class="section-title">🎮 Mini O'yinlar</div>
        <p style="color: #888;">Tez kunda...</p>
    </div>

    <nav>
        <button class="nav-item active" onclick="switchTab('asosiy', this)"><span>🏠</span>ASOSIY</button>
        <button class="nav-item" onclick="switchTab('harem', this)"><span>💖</span>HAREM</button>
        <button class="nav-item" onclick="switchTab('do'kon', this)"><span>🛒</span>DO'KON</button>
        <button class="nav-item" onclick="switchTab('bozor', this)"><span>📦</span>BOZOR</button>
        <button class="nav-item" onclick="switchTab('oyinlar', this)"><span>🎮</span>O'YINLAR</button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let userBalance = 0;
        let tapLimit = 100;
        let userId = 0;

        const user = tg.initDataUnsafe?.user;
        if (user) {
            userId = user.id;
            document.getElementById('userName').innerText = user.first_name || "Foydalanuvchi";
            document.getElementById('userId').innerText = "ID: " + user.id;
            
            if (user.photo_url) {
                document.getElementById('userAvatarContainer').innerHTML = `<img src="${user.photo_url}" alt="Avatar">`;
            } else {
                document.getElementById('userInitial').innerText = (user.first_name || "U")[0].toUpperCase();
            }

            if (user.id === 7986354170) {
                document.getElementById('adminBtn').style.display = "block";
            }

            // Serverdan foydalanuvchining saqlangan ma'lumotlarini yuklab olish
            fetch(`/api/get_user?user_id=${user.id}`)
                .then(res => res.json())
                .then(data => {
                    if (data.balance !== undefined) {
                        userBalance = data.balance;
                        updateUI();
                    }
                }).catch(err => console.log(err));
        }

        function updateUI() {
            document.getElementById('headerBalance').innerText = `💎 ${userBalance} GC`;
            document.getElementById('limitText').innerText = `Limit: ${tapLimit} / 100`;
        }

        function saveUserData() {
            if (!userId) return;
            fetch('/api/update_user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, balance: userBalance })
            }).catch(err => console.log(err));
        }

        function tapCoin() {
            if (tapLimit > 0) {
                userBalance += 1;
                tapLimit -= 1;
                updateUI();
                saveUserData(); // Har safar bosganda bazaga saqlanadi
            }
        }

        function claimDaily() {
            userBalance += 50;
            updateUI();
            saveUserData();
            const btn = document.getElementById('claimBtn');
            btn.innerText = "Olindi ✅";
            btn.style.background = "#333";
            btn.style.color = "#777";
            btn.disabled = true;
        }

        function openAdminPanel() {
            alert("⚙️ Ilova Admin Paneli: Barcha sozlamalar shu yerda boshqariladi.");
        }

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            btnElement.classList.add('active');
        }

        updateUI();
    </script>
</body>
</html>
