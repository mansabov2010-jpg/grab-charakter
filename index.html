<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grab Character</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0b141a; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(18, 28, 36, 0.9); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-weight: bold; font-size: 18px; color: #00d2ff; }
        .balance-box { background: rgba(0, 210, 255, 0.1); border: 1px solid #00d2ff; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        
        .content { flex: 1; padding: 15px; overflow-y: auto; display: none; }
        .content.active { display: block; }
        
        .profile-card { background: rgba(25, 35, 45, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 12px; display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        .avatar { width: 50px; height: 50px; background: #00d2ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: #000; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .clicker-box { background: rgba(25, 35, 45, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 15px; }
        .click-btn { width: 150px; height: 150px; background: radial-gradient(circle, #00d2ff, #005f73); border-radius: 50%; border: none; font-size: 32px; font-weight: bold; color: #fff; cursor: pointer; box-shadow: 0 0 20px rgba(0, 210, 255, 0.5); margin: 15px auto; display: flex; align-items: center; justify-content: center; transition: 0.1s; outline: none; }
        .click-btn:active { transform: scale(0.95); }
        
        .reward-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .reward-box { flex: 1; background: rgba(25, 35, 45, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 12px; text-align: center; }
        .claim-btn { background: #00d2ff; color: #000; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 8px; width: 100%; font-size: 12px; outline: none; }
        .claim-btn:active { opacity: 0.8; }

        .admin-panel-btn { background: #ff4757; color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: bold; width: 100%; margin-bottom: 15px; cursor: pointer; display: none; outline: none; }
        
        #adminModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; padding: 20px; overflow-y: auto; }
        .admin-group { margin-bottom: 12px; background: #121c24; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .admin-group label { font-size: 13px; color: #00d2ff; display: block; margin-bottom: 5px; }
        .admin-group input { width: 100%; padding: 8px; background: #0b141a; border: 1px solid #444; color: #fff; border-radius: 6px; }
        .admin-save-btn { background: #00d2ff; color: #000; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; width: 100%; }

        nav { display: flex; justify-content: space-around; background: #121c24; padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.1); }
        .nav-item { background: none; border: none; color: #888; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; outline: none; }
        .nav-item.active { color: #00d2ff; }
        .nav-item span { font-size: 18px; }

        .section-title { font-size: 20px; margin-bottom: 15px; color: #00d2ff; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Grab Character</div>
        <div class="balance-box" id="headerBalance">💎 0 GC</div>
    </header>

    <div id="tab-asosiy" class="content active">
        <button class="admin-panel-btn" id="adminBtn" onclick="toggleAdminPanel(true)">⚙️ Ilova Admin Paneli</button>

        <div class="profile-card">
            <div class="avatar" id="userAvatarContainer">
                <span id="userInitial">U</span>
            </div>
            <div>
                <h3 id="userName">Foydalanuvchi</h3>
                <p style="font-size: 12px; color: #888;" id="userId">ID: Aniqlanmoqda...</p>
            </div>
        </div>

        <div class="clicker-box">
            <button class="click-btn" onclick="tapCoin()">GC</button>
            <p id="limitText" style="color: #888; font-size: 14px;">Limit: 100 / 100</p>
        </div>

        <div class="reward-container">
            <div class="reward-box">
                <h4 style="font-size: 14px;">🪙 Kunlik Tanga</h4>
                <button class="claim-btn" id="claimCoinBtn" onclick="claimDailyCoin()">Olish (+<span id="dailyCoinVal">50</span>)</button>
            </div>
            <div class="reward-box">
                <h4 style="font-size: 14px;">💖 Kunlik Waifu</h4>
                <button class="claim-btn" id="claimWaifuBtn" onclick="claimDailyWaifu()">Olish</button>
            </div>
        </div>
    </div>

    <div id="tab-harem" class="content">
        <div class="section-title">✨ Sizning Haremingiz</div>
        <div id="haremList" style="color: #888;">Hozircha personajlar yo'q (0).</div>
    </div>

    <div id="tab-do'kon" class="content">
        <div class="section-title">🛒 Do'kon</div>
        <p style="color: #888;">Do'kon bo'sh.</p>
    </div>

    <div id="tab-bozor" class="content">
        <div class="section-title">📊 Bozor</div>
        <p style="color: #888;">Savdo-sotiq mavjud emas.</p>
    </div>

    <div id="tab-oyinlar" class="content">
        <div class="section-title">🎮 Mini O'yinlar</div>
        <p style="color: #888;">Tez kunda...</p>
    </div>

    <div id="adminModal">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="color: #00d2ff;">⚙️ Ilova Admin Paneli</h3>
            <button onclick="toggleAdminPanel(false)" style="background:none; border:none; color:#fff; font-size:22px; cursor:pointer;">✕</button>
        </div>
        
        <div class="admin-group">
            <label>Tanga limiti:</label>
            <input type="text" id="adm_tap_limit">
            <button class="admin-save-btn" onclick="saveSetting('tap_limit', 'adm_tap_limit')">Saqlash</button>
        </div>
        <div class="admin-group">
            <label>Kunlik Tanga miqdori:</label>
            <input type="text" id="adm_daily_reward">
            <button class="admin-save-btn" onclick="saveSetting('daily_reward', 'adm_daily_reward')">Saqlash</button>
        </div>
        <div class="admin-group">
            <label>Reklama matni:</label>
            <input type="text" id="adm_ad_text">
            <button class="admin-save-btn" onclick="saveSetting('ad_text', 'adm_ad_text')">Saqlash</button>
        </div>
    </div>

    <nav>
        <button class="nav-item active" onclick="switchTab('asosiy', this)"><span>🏠</span>ASOSIY</button>
        <button class="nav-item" onclick="switchTab('harem', this)"><span>💖</span>HAREM</button>
        <button class="nav-item" onclick="switchTab('do'kon', this)"><span>🛒</span>DO'KON</button>
        <button class="nav-item" onclick="switchTab('bozor', this)"><span>📦</span>BOZOR</button>
        <button class="nav-item" onclick="switchTab('oyinlar', this)"><span>🎮</span>O'YINLAR</button>
    </nav>

    <script>
        // Render manzili avtomatik to'g'ri yozildi:
        const BACKEND_URL = "https://grab-charakter.onrender.com";

        const tg = window.Telegram.WebApp;
        tg.expand();

        let userBalance = 0;
        let tapLimit = 100;
        let userId = 0;
        let settingsData = {};

        const user = tg.initDataUnsafe?.user;
        if (user) {
            userId = user.id;
            document.getElementById('userName').innerText = user.first_name || "Foydalanuvchi";
            document.getElementById('userId').innerText = "ID: " + user.id;
            
            if (user.photo_url) {
                document.getElementById('userAvatarContainer').innerHTML = `<img src="${user.photo_url}" alt="Avatar">`;
            } else {
                document.getElementById('userInitial').innerText = (user.first_name || "U")[0].toUpperCase();
            }

            if (user.id === 7986354170) {
                document.getElementById('adminBtn').style.display = "block";
            }

            fetch(`${BACKEND_URL}/api/get_user?user_id=${user.id}&username=${encodeURIComponent(user.username || '')}&first_name=${encodeURIComponent(user.first_name || '')}`)
                .then(res => res.json())
                .then(data => {
                    if (data.balance !== undefined) {
                        userBalance = data.balance;
                        updateUI();
                    }
                    if (data.settings) {
                        settingsData = data.settings;
                        document.getElementById('dailyCoinVal').innerText = settingsData.daily_reward || 50;
                        document.getElementById('adm_tap_limit').value = settingsData.tap_limit || 100;
                        document.getElementById('adm_daily_reward').value = settingsData.daily_reward || 50;
                        document.getElementById('adm_ad_text').value = settingsData.ad_text || "";
                    }
                    if (data.waifus && data.waifus.length > 0) {
                        let html = '';
                        data.waifus.forEach(w => {
                            html += `<div style="background:rgba(25,35,45,0.8); padding:10px; border-radius:10px; margin-bottom:10px;"><b>${w.name}</b> (${w.source})</div>`;
                        });
                        document.getElementById('haremList').innerHTML = html;
                    }
                }).catch(err => console.log("Xatolik:", err));
        }

        function updateUI() {
            document.getElementById('headerBalance').innerText = `💎 ${userBalance} GC`;
            document.getElementById('limitText').innerText = `Limit: ${tapLimit} / 100`;
        }

        function saveUserData() {
            if (!userId) return;
            fetch(`${BACKEND_URL}/api/update_user`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, balance: userBalance })
            }).catch(err => console.log("Saqlashda xato:", err));
        }

        function tapCoin() {
            if (tapLimit > 0) {
                userBalance += 1;
                tapLimit -= 1;
                updateUI();
                saveUserData();
            }
        }

        function claimDailyCoin() {
            let reward = parseInt(settingsData.daily_reward || 50);
            userBalance += reward;
            updateUI();
            saveUserData();
            const btn = document.getElementById('claimCoinBtn');
            btn.innerText = "Olindi ✅";
            btn.style.background = "#333";
            btn.style.color = "#777";
            btn.disabled = true;
        }

        function claimDailyWaifu() {
            alert("Bugungi kunlik waifu olindi!");
            const btn = document.getElementById('claimWaifuBtn');
            btn.innerText = "Olindi ✅";
            btn.style.background = "#333";
            btn.style.color = "#777";
            btn.disabled = true;
        }

        function toggleAdminPanel(show) {
            document.getElementById('adminModal').style.display = show ? 'block' : 'none';
        }

        function saveSetting(key, inputId) {
            let val = document.getElementById(inputId).value;
            fetch(`${BACKEND_URL}/api/admin_settings`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, key: key, value: val })
            }).then(res => res.json()).then(data => {
                if(data.status === 'success') {
                    alert("✅ Saqlandi!");
                    settingsData[key] = val;
                    if(key === 'daily_reward') document.getElementById('dailyCoinVal').innerText = val;
                } else {
                    alert("❌ Xatolik yuz berdi!");
                }
            });
        }

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            btnElement.classList.add('active');
        }

        updateUI();
    </script>
</body>
</html>
